# docker compose up   then open http://localhost:8000 (pulls minhal128/androguard)
# docker compose up --build   builds from source instead; needs data/models/codebert-lvdandro
# Superadmin: docker compose exec -e ANDROGUARD_PASSWORD=... web python -m app.manage create-superadmin you@example.com
# Set POSTGRES_PASSWORD in a .env file for anything beyond a local demo.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: androguard
      POSTGRES_USER: androguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U androguard -d androguard"]
      interval: 3s
      retries: 20
  web:
    image: minhal128/androguard
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://androguard:${POSTGRES_PASSWORD:-change-me}@db/androguard
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
